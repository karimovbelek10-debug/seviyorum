<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Sana 💌</title>
  <style>
    body {
      background: linear-gradient(to right, #ffdde1, #ee9ca7);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-width: 420px;
    }
    h1 {
      color: #e91e63;
    }
    p {
      font-size: 18px;
      color: #333;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>💖 Merhaba</h1>
    <p>
      Bu sayfa senin için hazırlandı.<br><br>
      Şimdilik burada örnek bir mesaj var.<br>
      Çok yakında kalbimden gelen sözler olacak…
    </p>
  </div>
</body>
</html>
